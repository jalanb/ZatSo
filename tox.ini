# Tox (http://codespeak.net/~hpk/tox/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist=py311

[testenv]
passenv=
    HOME

setenv=
    PYTHONPATH = {toxinidir}

deps =
    lints: -r requirements/linting.txt
    tests: -r requirements/testing.txt
    devs:  -r requirements/development.txt

commands_pre=
    python -c 'import sys; print(f"\{sys.executable} at \{sys.version.split()[0]}")'

commands=
    lints: black -S --check .
    lints: blackdoc -S --check --include '[.](md|py)' .
    lints: flake8 zatso
    lints: mypy --ignore-missing-imports --install-types --non-interactive zatso
    tests: py.test {posargs} --cov-report= --cov=zatso zatso
    devs: py.test {posargs} --exitfirst --random-order zatso

[pytest]
addopts =
    --doctest-glob=*.test
    --doctest-modules
doctest_optionflags= ELLIPSIS NORMALIZE_WHITESPACE

